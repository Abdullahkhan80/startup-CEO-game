version: '3.8'

services:
  # 1. Primary PostgreSQL Relational Database (Prisma)
  database:
    image: postgres:15-alpine
    container_name: startup-ceo-database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-startup_ceo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_db_pass_2026}
      POSTGRES_DB: ${DB_NAME:-startup_ceo_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-startup_ceo_user} -d ${DB_NAME:-startup_ceo_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Caching & Rate Limiting Layer
  redis:
    image: redis:7-alpine
    container_name: startup-ceo-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_redis_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. NestJS High-Performance Core API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: startup-ceo-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-startup_ceo_user}:${DB_PASSWORD:-secure_db_pass_2026}@database:5432/${DB_NAME:-startup_ceo_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secure_redis_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_aistudio_2026}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. NGINX Reverse Proxy and SSL Gateway
  nginx:
    image: nginx:stable-alpine
    container_name: startup-ceo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  # 5. Prometheus Metrics Telemetry Harvester
  prometheus:
    image: prom/prometheus:latest
    container_name: startup-ceo-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  # 6. Grafana Telemetry Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: startup-ceo-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_prod_pass_2026}
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/grafana-dashboard.json:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
