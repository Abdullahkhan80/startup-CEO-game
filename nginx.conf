user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # GZIP Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zone (10 requests per second burstable)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Backend API Server Upstream
    upstream app_backend {
        server backend:3000;
        keepalive 32;
    }

    # 1. HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name api.startupceosimulator.com;

        # Redirect all HTTP requests to HTTPS securely
        return 301 https://$host$request_uri;
    }

    # 2. Secure HTTPS Server Gateway
    server {
        listen 443 ssl http2;
        server_name api.startupceosimulator.com;

        # Cryptographic SSL Certificates (Managed via certbot)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Hardened SSL Protocols & Ciphers (Modern Profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_pref_cipher_server on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        
        # Session cache parameters
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (OWASP Hardening Recommendations)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Max payload client body limit (10MB for large game-saves)
        client_max_body_size 10M;

        # Root API reverse proxy location
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            
            # Connection and host headers
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Healthcheck endpoint (highly responsive, un-rate-limited)
        location /health {
            proxy_pass http://app_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
